name: KANTApdf bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Veröffentlichen (eine EXE, ohne .NET-Installation lauffähig)
        run: dotnet publish src/KantaPdf/KantaPdf.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: KANTApdf
          path: out/KANTApdf.exe

      # Direkter Download ohne Anmeldung:
      # https://github.com/managerschutz-web/kantapdf-windows/releases/latest/download/KANTApdf.exe
      - name: Als Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KANTApdf – Build ${{ github.run_number }}
          make_latest: true
          files: out/KANTApdf.exe
          body: |
            Direkt-Download der aktuellen KANTApdf.exe (Windows 10/11, 64 Bit, ohne .NET-Installation lauffähig).
            Beim ersten Start warnt SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“.

            Made with ♥ in Ummaschumm
